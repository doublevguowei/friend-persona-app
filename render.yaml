services:
  - type: web
    name: friend-persona-api
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python start.py
    envVars:
      - key: APP_TIMEZONE
        value: Asia/Shanghai
      - key: DATABASE_URL
        value: sqlite:///./friend_persona.db
      - key: CORS_ORIGINS
        value: "*"
